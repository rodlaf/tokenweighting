repos:
  - repo: local
    hooks:
      - id: latex-build
        name: Build LaTeX PDF
        entry: bash -c 'cd paper && latexmk -pdf main.tex && cd .. && git add paper/main.pdf'
        language: system
        files: '\.tex$'
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
