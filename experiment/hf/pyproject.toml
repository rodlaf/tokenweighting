[project]
name = "itw-experiment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "peft",
    "datasets",
    "bitsandbytes",
    "accelerate",
    "pyyaml",
]

[project.optional-dependencies]
wandb = ["wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data.py", "rewards.py", "token_weights.py", "run_experiment.py", "tasks"]
