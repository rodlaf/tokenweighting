# Base config for the NeurIPS sprint: Qwen3-4B-Base + POLARIS-53k.
#
# Hyperparameters draw from:
#   - Poly-EPO (arXiv:2604.17654): Qwen3-4B-Base, POLARIS dataset, T=1.0,
#     LR ~5e-6, long generations.
#   - Internal company recipe for verifiable-reward RL on Qwen2.5-7B.
#
# Notes:
#   * batch_size=2 + grad_accum=8 -> effective batch 16 prompts/step.
#     With num_generations=8 that is 128 rollouts/step.
#   * Deadline run trains for 150 steps (19.2k rollouts) to finish by May 6.
#   * Primary eval: POLARIS held-out 1k (deterministic split).
#     Bonus end-of-training evals: MATH-500, GSM8K-200 (OOD generalization).
#
# Override `seed`, `output_dir`, `training.weighting`, and `model.lora.{r,alpha}`
# in experiment configs.

seed: 1337
output_dir: outputs/qwen3-4b-base-polaris

model:
  name_or_path: Qwen/Qwen3-4B-Base
  torch_dtype: bfloat16
  load_in_4bit: false
  attn_implementation: sdpa
  gradient_checkpointing: true
  lora:
    enabled: true
    r: 64
    alpha: 128
    dropout: 0.05

dataset:
  name: polaris
  train_split: train
  eval_split: test
  max_train_samples:
  max_eval_samples: 1000

training:
  algorithm: rloo
  weighting: uniform
  train_steps: 150
  batch_size: 2
  grad_accum_steps: 8
  learning_rate: 5.0e-6
  weight_decay: 0.0
  warmup_steps: 15
  num_generations: 8
  max_prompt_length: 512
  max_new_tokens: 1024
  temperature: 1.0
  top_p: 0.95
  max_grad_norm: 1.0
  eval_every: 50
  save_every: 50

evaluation:
  num_examples: 1000
  pass_k: 4
  batch_size: 4
  code_timeout: 3.0
  bonus_evals:
    - name: math
      split: test
      num_examples: 500
    - name: gsm8k
      split: test
      num_examples: 200
