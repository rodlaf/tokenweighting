[project]
name = "itw-experiment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "peft<0.15",
    "datasets",
    "bitsandbytes",
    "accelerate",
    "pyyaml",
    "matplotlib",
    "pandas",
    "pytest",
]

[project.optional-dependencies]
wandb = ["wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data.py", "rewards.py", "token_weights.py", "run_experiment.py", "tasks"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
