# Base config for the NeurIPS sprint: Qwen3-4B-Base + POLARIS-53k.
#
# Hyperparameters draw from:
#   - Poly-EPO (arXiv:2604.17654): Qwen3-4B-Base, POLARIS dataset, T=1.0,
#     LR ~5e-6, long generations.
#   - Internal company recipe for verifiable-reward RL on Qwen2.5-7B.
#
# Notes:
#   * batch_size=1 + grad_accum=16 -> effective batch 16 prompts/step.
#     With num_generations=8 that is 128 rollouts/step.
#   * Training runs for 400 steps (-> ~51k rollouts seen, ~1 epoch over POLARIS).
#   * Primary eval: POLARIS held-out 1k (deterministic split).
#     Bonus end-of-training evals: MATH-500, GSM8K-200 (OOD generalization).
#
# Override `seed`, `output_dir`, `training.weighting`, and `model.lora.{r,alpha}`
# in experiment configs.

seed: 1337
output_dir: outputs/qwen3-4b-base-polaris

model:
  name_or_path: Qwen/Qwen3-4B-Base
  torch_dtype: bfloat16
  load_in_4bit: false
  lora:
    enabled: true
    r: 64
    alpha: 128
    dropout: 0.05

dataset:
  name: polaris
  train_split: train
  eval_split: test
  max_train_samples:
  max_eval_samples: 1000

training:
  algorithm: rloo
  weighting: uniform
  train_steps: 400
  batch_size: 1
  grad_accum_steps: 16
  learning_rate: 5.0e-6
  weight_decay: 0.0
  warmup_steps: 40
  num_generations: 8
  max_prompt_length: 512
  max_new_tokens: 1024
  temperature: 1.0
  top_p: 0.95
  max_grad_norm: 1.0
  eval_every: 50
  save_every: 100

evaluation:
  num_examples: 1000
  pass_k: 4
  code_timeout: 3.0
  bonus_evals:
    - name: math
      split: test
      num_examples: 500
    - name: gsm8k
      split: test
      num_examples: 200
